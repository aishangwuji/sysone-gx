# =============================================================================
# sysone.originagent.cn HTTPS 入口 — SysOne GX 智能决策流工作台
# 443 -> stream SNI -> 8444 -> 本 server 块 -> 127.0.0.1:3004
# =============================================================================
server {
    listen 8444 ssl;
    server_name sysone.originagent.cn;

    ssl_certificate /etc/letsencrypt/live/sysone.originagent.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysone.originagent.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/sysone-ssl-access.log;
    error_log  /var/log/nginx/sysone-ssl-error.log;

    client_max_body_size 20M;

    # 安全头
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
